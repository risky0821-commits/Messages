name: Sama debug build

on:
  push:
    branches:
      - sama/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore stable Sama debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sama-debug-keystore-v1

      - name: Restore stable debug signing key from GitHub secret
        env:
          SAMA_DEBUG_KEYSTORE_BASE64: ${{ secrets.SAMA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${SAMA_DEBUG_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$HOME/.android"
            echo "$SAMA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi

      - name: Create stable debug signing key if missing
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Foss debug APK
        run: ./gradlew assembleFossDebug -PVERSION_CODE=${{ github.run_number }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sama-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
