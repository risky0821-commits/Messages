name: Sama debug build

on:
  push:
    branches:
      - sama/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore existing Sama debug signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: sama-debug-keystore-v1

      - name: Restore signing key from secret when configured
        env:
          SAMA_DEBUG_KEYSTORE_BASE64: ${{ secrets.SAMA_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SAMA_DEBUG_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$HOME/.android"
            umask 077
            printf '%s' "$SAMA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Signing source: repository secret"
          else
            echo "::warning::Signing source: legacy cache. Permanent secret setup is still required."
          fi
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::Existing signing key is missing. Refusing to generate an incompatible replacement."
            exit 1
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null

      - name: Check database migration SQL
        run: python3 scripts/check_database_migrations.py

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Foss debug APK
        run: ./gradlew assembleFossDebug -PVERSION_CODE=${{ github.run_number }} --stacktrace

      - name: Download installed Build 176 as compatibility reference
        uses: actions/download-artifact@v4
        with:
          name: Sama-debug-apk
          run-id: 34320608051
          github-token: ${{ github.token }}
          path: reference-apk

      - name: Verify signature and upgrade compatibility
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-upgrade.sh reference-apk app/build/outputs/apk/foss/debug | tee upgrade-verification.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Sama-debug-apk
          path: |
            app/build/outputs/apk/foss/debug/*.apk
            upgrade-verification.txt
          if-no-files-found: error
